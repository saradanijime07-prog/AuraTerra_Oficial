<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>AuraTerra - Gestión de Rescates</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-success mb-4">🐾 AuraTerra - Plataforma de Rehabilitación de Fauna</h2>

        <!-- Formulario de Registro -->
        <div class="card shadow p-4 mb-4">
            <h4>Registrar Nuevo Animal</h4>
            <form th:action="@{/animales/guardar}" th:object="${nuevoAnimal}" method="post" class="row g-3 mt-2">
                <div class="col-md-4">
                    <input type="text" th:field="*{nombre}" class="form-control" placeholder="Nombre" required>
                </div>
                <div class="col-md-4">
                    <input type="text" th:field="*{especie}" class="form-control" placeholder="Especie" required>
                </div>
                <div class="col-md-2">
                    <input type="number" th:field="*{edad}" class="form-control" placeholder="Edad">
                </div>
                <div class="col-md-2">
                    <input type="text" th:field="*{estadoSalud}" class="form-control" placeholder="Estado de Salud">
                </div>
                <div class="col-12">
                    <textarea th:field="*{observaciones}" class="form-control"
                        placeholder="Observaciones del rescate"></textarea>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-success">Guardar Animal</button>
                </div>
            </form>
        </div>

        <!-- Tabla de Listado -->
        <div class="card shadow p-4">
            <h4>Animales Registrados</h4>
            <table class="table table-striped mt-3">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Especie</th>
                        <th>Edad</th>
                        <th>Estado de Salud</th>
                        <th>Observaciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="animal : ${animales}">
                        <td th:text="${animal.id}"></td>
                        <td th:text="${animal.nombre}"></td>
                        <td th:text="${animal.especie}"></td>
                        <td th:text="${animal.edad}"></td>
                        <td th:text="${animal.estadoSalud}"></td>
                        <td th:text="${animal.observaciones}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>

</html>
